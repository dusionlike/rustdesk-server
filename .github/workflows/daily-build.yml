name: Daily build

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Linux - ${{ matrix.name }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: amd64, target: x86_64-unknown-linux-musl }
          - { name: arm64v8, target: aarch64-unknown-linux-musl }
          - { name: armv7, target: armv7-unknown-linux-musleabihf }
          - { name: i386, target: i686-unknown-linux-musl }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        run: cargo install cross --version 0.2.5 --locked
      - name: Build
        run: cross build --release --all-features --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/hbbs dist/
          cp target/${{ matrix.target }}/release/hbbr dist/
          cp target/${{ matrix.target }}/release/rustdesk-utils dist/
          cd dist
          zip ../rustdesk-server-linux-${{ matrix.name }}.zip hbbs hbbr rustdesk-utils
      - uses: actions/upload-artifact@v4
        with:
          name: rustdesk-server-linux-${{ matrix.name }}
          path: rustdesk-server-linux-${{ matrix.name }}.zip
          if-no-files-found: error

  build-windows:
    name: Windows - x86_64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build
        run: cargo build --release --all-features --target x86_64-pc-windows-msvc
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path target\x86_64-pc-windows-msvc\release\hbbs.exe,target\x86_64-pc-windows-msvc\release\hbbr.exe,target\x86_64-pc-windows-msvc\release\rustdesk-utils.exe -DestinationPath rustdesk-server-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: rustdesk-server-windows-x86_64
          path: rustdesk-server-windows-x86_64.zip
          if-no-files-found: error

  publish:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Move nightly tag
        run: |
          git tag --force nightly "${GITHUB_SHA}"
          git push --force origin refs/tags/nightly
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly
          prerelease: true
          make_latest: false
          overwrite_files: true
          body: Daily build from ${{ github.sha }}.
          files: artifacts/*.zip
